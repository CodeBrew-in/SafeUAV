<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="__TOKEN__">
<title>SafeUAV Console</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo">&#9650;</span> SafeUAV <small id="ver"></small></div>
  <div id="phase" class="badge">DRAFT</div>
  <div class="grow"></div>
  <div class="tag">SIMULATION ONLY</div>
</header>

<main>
  <section id="mapwrap">
    <canvas id="map" tabindex="0" aria-label="Campus map"></canvas>
    <div id="banner"><span id="banner-main">Add a target, then press Start</span><span id="banner-sub"></span></div>
    <div id="toasts"></div>
    <div id="reject" class="hidden"></div>
    <div id="replan" class="hidden"></div>
    <div id="stale" class="hidden"></div>
    <div id="card" class="hidden"></div>
    <div id="mapctl">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">&minus;</button>
      <button id="fit" title="Fit campus">Fit</button>
      <button id="follow" title="Follow the drone" aria-pressed="false">Follow</button>
    </div>
    <div id="scalebar"><div id="scalebar-line"></div><span id="scalebar-txt"></span></div>
    <div id="north">N</div>
    <div id="directnote" class="hidden">AI-direct mode: no shield, no animation. The route the AI wrote is drawn in red.</div>
    <div id="legend">
      <span><i class="sw nofly"></i>no-fly (permanent)</span>
      <span><i class="sw avoid"></i>restricted by you</span>
      <span><i class="sw pad"></i>landing pad</span>
      <span><i class="sw route"></i>planned route</span>
      <span><i class="sw trail"></i>flown</span>
    </div>
  </section>

  <aside id="side">
    <div id="controls" class="panel">
      <div class="row">
        <button id="start" class="primary big">Start</button>
        <button id="pause" class="big">Pause</button>
        <button id="reset" class="big">Reset</button>
      </div>
      <div class="row">
        <span class="lbl">Speed</span>
        <div id="speeds" class="seg"></div>
        <div class="grow"></div>
        <button id="rtb" class="warn small" title="Fly back to base (works without the AI)">Return now</button>
        <button id="land" class="warn small" title="Land on the nearest pad (works without the AI)">Land now</button>
        <button id="endm" class="small" title="Land and finish this mission. The drone then waits for a new order. Works without the AI.">End mission</button>
      </div>
      <div class="row">
        <div class="bar" title="Battery; the mark is the reserve the drone never uses"><div id="batt"></div><div class="reserve"></div></div>
        <span id="battv" class="mono"></span>
        <span id="clk" class="mono"></span>
      </div>
      <div id="shield" class="mono"></div>
    </div>

    <nav id="tabs" class="tabs">
      <button data-tab="mission" class="on">Mission</button>
      <button data-tab="chat">Chat</button>
      <button data-tab="log">Log</button>
    </nav>

    <div id="tab-mission" class="panel tab"></div>
    <div id="tab-chat" class="panel tab hidden">
      <div id="chat"></div>
      <div id="thinking" class="hidden"></div>
      <div id="presets"></div>
      <form id="chatform"><input id="chatin" placeholder="Type an order or a change…" autocomplete="off" maxlength="2000"><button class="primary">Send</button></form>
    </div>
    <div id="tab-log" class="panel tab hidden">
      <div id="downloads" class="row"></div>
      <div id="log" class="mono"></div>
    </div>
  </aside>
</main>
<script src="/static/app.js"></script>
</body>
</html>
